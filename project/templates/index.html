<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gene Knowledge Base - Volcano Plot</title>
    <!-- Add Plotly.js CDN -->
    <script src='https://cdn.plot.ly/plotly-3.0.0.min.js'></script>
    <!-- Add GSAP from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.1/gsap.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js",
            "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.webgpu.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/",
            "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/",
            "camera-controls": "https://cdn.jsdelivr.net/npm/camera-controls@1.34.2/dist/camera-controls.module.js",
            "gsap": "https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.1/gsap.min.js",
            "dat.gui": "https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.module.js"
          }
        }
    </script>




</head>
<body>
    <audio id="backgroundMusic" loop>
        <source src="{{ url_for('static', filename='audio/interstellar_piano.mp3') }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>


    <div class="loader-container">
        <h1>JetBrains Gene Base</h1>
        <div class="title">
            Gene Knowledge Base Web Service
        </div>
        <div class="loader">Loading Gene Base</div>
        <button id="exploreBtn" style="display: none">Explore the base</button>
    </div>

    <button id="testButton">
        Test Page
    </button>

    <div id="myDiv" style="display: none">

        <button id="toggleButton" style="display: none">2D</button>
        <button id="resetButton" style="display: none">
            Reset to Initial Position
        </button>
        <div id="musicElement" style="display: none">
            <button id="resetMusic">
                <img src="{{ url_for('static', filename='images/reset.png') }}" alt="Reset Music">
            </button>

            <button id="toggleMusic">
                <img id="playIcon" src="{{ url_for('static', filename='images/play.png') }}" alt="Reset Music" style="display: none">
                <img id="pauseIcon" src="{{ url_for('static', filename='images/pause.png') }}" alt="Reset Music">
            </button>
        </div>
        <div id="elem-info" style="display: none"></div>
        <div id="sidebar" style="display: none">
            <div class="lava-lamp" style="display: none">
              <div class="bubble"></div>
              <div class="bubble1"></div>
              <div class="bubble2"></div>
              <div class="bubble3"></div>
            </div>
            <!-- Search bar and back button -->
            <label class="label">
                <input type="text" class="search_bar" placeholder="Search for something..." />
            </label>
            <button id="close-info">Back</button>

            <!-- Title above the sidebar content -->
            <div id="welcome-message">
                <h2>Welcome Gene Knowledge Base</h2>
            </div>

            <!-- Container for important genes -->
            <div id="important-genes">
                <div class="header">
                    <div class="left">
                        <h3 id="symbolName">Top Genes</h3>
                    </div>
                    <div class="right">
                        <h3 id="logTitle">logFC</h3>
                        <h3 id="pTitle">adj_P_Val</h3>
                    </div>
                </div>

                <div id="genes-list"></div>
                <button id="moreImportantBtn">more indices</button>
            </div>

            <!-- Protein plot and scientific paper container -->
            <div id="protein-plot"></div>
            <div id="scientific-paper"></div>
            <button id="loadMoreBtn"></button>
            <div id="sidebar-content"></div>
        </div>
    </div>
{#    <script src="{{ url_for('static', filename='js/index.js') }}"></script>#}
    <script type="module" src="{{ url_for('static', filename='js/index-three.js') }}"></script>
    <script>
        let music = document.getElementById("backgroundMusic");

        function userInteraction() {
            music.play().catch(error => console.log("Autoplay failed:", error));
            document.removeEventListener("mousemove", userInteraction);
            document.removeEventListener("click", userInteraction);
        }

        // Ako korisnik pomeri miša ili klikne, pokreće se muzika
        document.addEventListener("mousemove", userInteraction);
        document.addEventListener("click", userInteraction);
    </script>
</body>
</html>
